<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0.04" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#FFB35C"/>
      <stop offset="0.52" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#F04E7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="depth" x1="0" y1="0.45" x2="0" y2="1">
      <stop offset="0" stop-color="#3A0A14" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A0A14" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0E6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#3A0A14" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- macOS 圆角方形底板：暖色，与主程序区分 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#depth)"/>

  <!-- 查看窗口边框 + 播放三角 -->
  <g filter="url(#shadow)" fill="none" stroke="url(#glyph)" stroke-linejoin="round" stroke-linecap="round">
    <rect x="222" y="272" width="580" height="480" rx="104" stroke-width="48"/>
  </g>
  <path d="M 432 398 L 432 626 L 620 512 Z"
        fill="url(#glyph)" stroke="url(#glyph)" stroke-width="40"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
