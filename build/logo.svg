<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0.04" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#7C6CF6"/>
      <stop offset="0.52" stop-color="#4F6BF5"/>
      <stop offset="1" stop-color="#0FB5C9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="depth" x1="0" y1="0.45" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1033" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1033" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F4FF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#091034" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- macOS 圆角方形底板 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#depth)"/>

  <!-- 播放三角 + 声波 -->
  <g filter="url(#shadow)">
    <path d="M 252 352 L 252 672 L 512 512 Z"
          fill="url(#glyph)" stroke="url(#glyph)" stroke-width="46"
          stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="url(#glyph)">
      <rect x="576" y="432" width="36" height="160" rx="18"/>
      <rect x="638" y="372" width="36" height="280" rx="18"/>
      <rect x="700" y="342" width="36" height="340" rx="18"/>
      <rect x="762" y="392" width="36" height="240" rx="18"/>
    </g>
  </g>
</svg>
